name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wardrobe
          POSTGRES_PASSWORD: wardrobe
          POSTGRES_DB: wardrobe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wardrobe -d wardrobe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://wardrobe:wardrobe@localhost:5432/wardrobe
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @wardrobe/db run db:generate
      - run: pnpm --filter @wardrobe/db run db:migrate:deploy

      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
