name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          generate: "false"
      - run: pnpm run lint

  typecheck:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://wardrobe:wardrobe@localhost:5432/wardrobe
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wardrobe
          POSTGRES_PASSWORD: wardrobe
          POSTGRES_DB: wardrobe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wardrobe -d wardrobe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://wardrobe:wardrobe@localhost:5432/wardrobe
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @wardrobe/db run db:migrate:deploy
      - run: pnpm --filter @wardrobe/db run db:seed
      - run: pnpm run test

  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://wardrobe:wardrobe@localhost:5432/wardrobe
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run build
