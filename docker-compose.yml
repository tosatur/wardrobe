services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wardrobe
      POSTGRES_PASSWORD: wardrobe
      POSTGRES_DB: wardrobe
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardrobe -d wardrobe"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wardrobe:wardrobe@postgres:5432/wardrobe
      PORT: "3001"
      # Dev-only default; override for any real deployment.
      BETTER_AUTH_SECRET: "hYsdi3FvOpmMMqIiaNzdKF/bwwyx0bOe8mDBkzeXcog="
      BETTER_AUTH_URL: http://localhost:3001
      WEB_URL: http://localhost:3000
      STORAGE_DIR: /data/photos
      MAX_UPLOAD_BYTES: "10485760"
    volumes:
      - photo-storage:/data/photos
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wardrobe:wardrobe@postgres:5432/wardrobe
      STORAGE_DIR: /data/photos
    volumes:
      - photo-storage:/data/photos

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:3001
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  photo-storage:
